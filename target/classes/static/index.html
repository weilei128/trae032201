<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线备忘录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-danger:hover {
            background: #ff3838;
        }

        .btn-secondary {
            background: #747d8c;
            color: white;
        }

        .btn-secondary:hover {
            background: #57606f;
        }

        .memo-list {
            display: grid;
            gap: 16px;
        }

        .memo-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .memo-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .memo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .memo-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2d3436;
        }

        .memo-id {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.875rem;
        }

        .memo-content {
            color: #636e72;
            line-height: 1.6;
            margin-bottom: 12px;
            white-space: pre-wrap;
        }

        .memo-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .memo-time {
            font-size: 0.875rem;
            color: #b2bec3;
        }

        .memo-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #b2bec3;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            transform: translateX(150%);
            transition: transform 0.3s;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: #2ecc71;
        }

        .toast.error {
            background: #e74c3c;
        }

        .section-title {
            font-size: 1.5rem;
            color: #2d3436;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, #667eea, transparent);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.75rem;
            }

            .card {
                padding: 16px;
            }

            .memo-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 在线备忘录</h1>

        <!-- 添加备忘录表单 -->
        <div class="card">
            <h2 class="section-title">添加新备忘录</h2>
            <form id="memoForm">
                <div class="form-group">
                    <label for="title">标题</label>
                    <input type="text" id="title" name="title" placeholder="请输入备忘录标题" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="content">内容</label>
                    <textarea id="content" name="content" placeholder="请输入备忘录内容" required maxlength="1000"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">✨ 添加备忘录</button>
            </form>
        </div>

        <!-- 备忘录列表 -->
        <div class="card">
            <h2 class="section-title">我的备忘录</h2>
            <div id="memoList" class="memo-list">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    <p>暂无备忘录，添加一个吧！</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>

    <script>
        const API_BASE_URL = 'http://localhost:10012/api/memo';

        // 显示 Toast 提示
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 格式化日期时间
        function formatDateTime(dateTimeStr) {
            if (!dateTimeStr) return '';
            const date = new Date(dateTimeStr);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 加载备忘录列表
        async function loadMemos() {
            try {
                const response = await fetch(`${API_BASE_URL}/list`);
                const result = await response.json();

                if (result.code === 200) {
                    renderMemoList(result.data);
                } else {
                    showToast(result.message || '加载失败', 'error');
                }
            } catch (error) {
                showToast('网络错误，请检查服务是否启动', 'error');
                console.error('Error:', error);
            }
        }

        // 渲染备忘录列表
        function renderMemoList(memos) {
            const memoListEl = document.getElementById('memoList');

            if (!memos || memos.length === 0) {
                memoListEl.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        <p>暂无备忘录，添加一个吧！</p>
                    </div>
                `;
                return;
            }

            memoListEl.innerHTML = memos.map(memo => `
                <div class="memo-item" data-id="${memo.id}">
                    <div class="memo-header">
                        <div class="memo-title">${escapeHtml(memo.title)}</div>
                        <span class="memo-id">#${memo.id}</span>
                    </div>
                    <div class="memo-content">${escapeHtml(memo.content)}</div>
                    <div class="memo-footer">
                        <span class="memo-time">${formatDateTime(memo.createTime)}</span>
                        <div class="memo-actions">
                            <button class="btn btn-danger btn-small" onclick="deleteMemo(${memo.id})">删除</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // HTML 转义防止 XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 添加备忘录
        document.getElementById('memoForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();

            if (!title || !content) {
                showToast('请填写标题和内容', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/add`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title, content })
                });

                const result = await response.json();

                if (result.code === 200) {
                    showToast('备忘录添加成功！');
                    document.getElementById('memoForm').reset();
                    loadMemos();
                } else {
                    showToast(result.message || '添加失败', 'error');
                }
            } catch (error) {
                showToast('网络错误，请检查服务是否启动', 'error');
                console.error('Error:', error);
            }
        });

        // 删除备忘录
        async function deleteMemo(id) {
            if (!confirm('确定要删除这条备忘录吗？')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/delete/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (result.code === 200) {
                    showToast('备忘录删除成功！');
                    loadMemos();
                } else {
                    showToast(result.message || '删除失败', 'error');
                }
            } catch (error) {
                showToast('网络错误，请检查服务是否启动', 'error');
                console.error('Error:', error);
            }
        }

        // 页面加载时获取备忘录列表
        document.addEventListener('DOMContentLoaded', loadMemos);
    </script>
</body>
</html>
